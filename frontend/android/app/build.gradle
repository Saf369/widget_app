plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

android {
    namespace = "com.example.frontend"
    compileSdk = 35
    ndkVersion = "26.1.10909125"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.saf369.customsyllabus"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildFeatures {
        compose true
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.glance:glance-appwidget:1.1.1"
    implementation "androidx.glance:glance-material3:1.1.1"
}

// Automatically generate google-services.json from .env if the file is not checked into Git
task generateGoogleServicesJson {
    doLast {
        File gsFile = file("google-services.json")
        if (!gsFile.exists()) {
            println "[GoogleServices] google-services.json not found on disk. Generating dynamically from .env..."
            
            def candidateFiles = [
                file(".env"),
                file("../.env"),
                file("../../.env"),
                file("../../../.env"),
                file("../../backend/.env")
            ]
            
            def envProps = [:]
            for (File candidate : candidateFiles) {
                if (candidate.exists()) {
                    candidate.eachLine { line ->
                        line = line.trim()
                        if (line && !line.startsWith("#") && line.contains("=")) {
                            def parts = line.split("=", 2)
                            def key = parts[0].trim()
                            def val = parts[1].trim().replaceAll('^"|"$', '').replaceAll("^'|'\$", '')
                            if (!envProps.containsKey(key)) {
                                envProps[key] = val
                            }
                        }
                    }
                }
            }

            def projectNumber = envProps['FIREBASE_PROJECT_NUMBER'] ?: System.getenv('FIREBASE_PROJECT_NUMBER') ?: '505052765177'
            def projectId = envProps['FIREBASE_PROJECT_ID'] ?: System.getenv('FIREBASE_PROJECT_ID') ?: 'widgetapp-b8efb'
            def storageBucket = envProps['FIREBASE_STORAGE_BUCKET'] ?: System.getenv('FIREBASE_STORAGE_BUCKET') ?: 'widgetapp-b8efb.firebasestorage.app'
            def appId = envProps['FIREBASE_APP_ID'] ?: System.getenv('FIREBASE_APP_ID') ?: '1:505052765177:android:03791b1ae8484d881e3b28'
            def pkgName = envProps['ANDROID_PACKAGE_NAME'] ?: System.getenv('ANDROID_PACKAGE_NAME') ?: 'com.saf369.customsyllabus'
            def apiKey = envProps['FIREBASE_ANDROID_API_KEY'] ?: envProps['FIREBASE_API_KEY'] ?: System.getenv('FIREBASE_ANDROID_API_KEY') ?: System.getenv('FIREBASE_API_KEY') ?: ''
            def webClientId = envProps['GOOGLE_WEB_CLIENT_ID'] ?: envProps['GOOGLE_OAUTH_CLIENT_ID'] ?: '505052765177-jgrkglr7gl2iag31r7l62n3mukc255ct.apps.googleusercontent.com'
            def androidClientId = envProps['GOOGLE_ANDROID_CLIENT_ID'] ?: envProps['GOOGLE_OAUTH_ANDROID_CLIENT_ID'] ?: '505052765177-roop5orhsemohk50qd2ngoe05tlla877.apps.googleusercontent.com'
            def certHash = envProps['GOOGLE_CERTIFICATE_HASH'] ?: '744a819579c27933c0c141e7c07708a5f98b491a'

            def json = [
                project_info: [
                    project_number: projectNumber,
                    project_id: projectId,
                    storage_bucket: storageBucket
                ],
                client: [
                    [
                        client_info: [
                            mobilesdk_app_id: appId,
                            android_client_info: [
                                package_name: pkgName
                            ]
                        ],
                        oauth_client: [
                            [
                                client_id: androidClientId,
                                client_type: 1,
                                android_info: [
                                    package_name: pkgName,
                                    certificate_hash: certHash
                                ]
                            ],
                            [
                                client_id: webClientId,
                                client_type: 3
                            ]
                        ],
                        api_key: [
                            [
                                current_key: apiKey
                            ]
                        ],
                        services: [
                            appinvite_service: [
                                other_platform_oauth_client: [
                                    [
                                        client_id: webClientId,
                                        client_type: 3
                                    ]
                                ]
                            ]
                        ]
                    ]
                ],
                configuration_version: "1"
            ]

            gsFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
            println "[GoogleServices] Successfully generated google-services.json from environment variables."
        }
    }
}

afterEvaluate {
    tasks.matching { it.name.startsWith("process") && it.name.endsWith("GoogleServices") }.configureEach { task ->
        task.dependsOn generateGoogleServicesJson
        task.doLast {
            File gsFile = file("google-services.json")
            if (gsFile.exists()) {
                gsFile.delete()
                println "[GoogleServices] Cleaned up temporary google-services.json from source tree."
            }
        }
    }
}

